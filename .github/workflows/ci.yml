name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install PDF and Bangla/English OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ben
      - run: npm exec --workspace @uttirno/agent -- playwright install --with-deps chromium
      - name: Support Chromium sandbox on restricted Ubuntu runners
        run: bash scripts/configure-browser-sandbox-ci.sh
      - run: npm run check
      - run: npm run build
      - run: npm run local:init
      - run: npm run local:up
      - run: npm run db:migrate
      - run: npm run check:services
      - run: npm run test:integration
      - run: npm run test:admin
      - run: npm run smoke:foundation
      - if: always()
        run: docker compose --env-file .env -f infra/local/compose.yaml down
  deployment-rehearsal:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run local:init
      - run: npm run local:up
      - name: Build immutable app and isolated native-parser images
        run: |
          docker build --target parser -t uttirno-m8-parser:local --build-arg REVISION=${{ github.sha }} -f infra/deployment/Dockerfile .
          docker build --target runtime -t uttirno-m8:local --build-arg REVISION=${{ github.sha }} -f infra/deployment/Dockerfile .
      - run: npm run test:deployment
      - if: always()
        run: docker compose --env-file .env -f infra/local/compose.yaml down
